version: '3.8'

services:
  postgres:
    build:
      context: .
      dockerfile: docker/Dockerfile.postgres
    container_name: bgf-postgres
    environment:
      POSTGRES_DB: business_gap_finder
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: bgf-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/business_gap_finder
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DEBUG: "true"
      CRAWLER_MAX_CONCURRENCY: "10"
      CRAWLER_TIMEOUT: "30"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: bgf-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: bgf-worker
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/business_gap_finder
      CRAWLER_MAX_CONCURRENCY: "5"
      CRAWLER_BROWSER_CONCURRENCY: "1"
      CRAWLER_TIMEOUT: "30"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - ./workers:/app/workers
      - ./packages:/app/packages

volumes:
  postgres_data:
